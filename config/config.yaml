# =============================================================================
# Cancer-risk-MSM — single source of truth (paths + parameters, no data values)
#
# SCOPE: this repo is the DOWNSTREAM layer. Variant annotation, P/LP
# classification, carrier extraction, AND sample-level QC are all owned by the
# Nextflow pipeline `Huang-lab/germline-plp-carrier-nf`, whose outputs we
# consume read-only. We own: EHR phenotyping, analysis-ready joins, and
# cancer-risk ML.
# =============================================================================

project:
  name: Cancer-risk-MSM
  reference_build: GRCh38
  # Nested under the shared project dir so all MSM P/LP work lives together,
  # but in its own subtree so the two pipelines never write the same paths.
  output_root: /sc/arion/projects/rg_huangk06/variants_PLP_MSM/cancer_risk

# --- Inputs (all read-only) --------------------------------------------------
inputs:
  msm_data_root: /sc/arion/projects/MSM/data

  # Raw WES pVCF chunks — used ONLY to enumerate which samples have genotypes
  # (for the "with WES" counts). Annotation and sample QC are NOT our job.
  wes:
    pvcf_target_glob: "WES/combined/batch_*/pVCF/Target"
    batch: null                    # null -> auto-select highest batch_###
    chunk_glob: "*.vcf.gz"
    expected_chunks: 498
    # Plain-text list of WES sample IDs, one per line.
    # Produced by workflow/09_export_wes_samples.sh (`bcftools query -l`).
    sample_list_file: null         # e.g. <output_root>/resources/wes_samples.txt

  # Outputs of germline-plp-carrier-nf that we consume.
  carrier_source:
    nf_results_root: /sc/arion/projects/rg_huangk06/variants_PLP_MSM
    # One or more NF run-output dirs to pool. Confirm which are authoritative.
    results_dirs:
      - results-batch1
      - results-batch2
      - results-batch3
    carrier_matrix: "carriers/carrier_matrix.tsv"   # long: variant x person
    variants_dir:   "variants"                      # clinvar_plp / acmg_plp / am_plp / qc_per_gene
    manifest:       "manifest.json"                 # ref build + tool versions + pipeline SHA
    # Sample-level QC is done by the NF pipeline. Point these at its outputs so
    # ML can (a) restrict to QC-passing samples and (b) get relatedness for
    # group-aware cross-validation. Paths are relative to each results dir.
    # TODO(user): confirm the actual NF filenames.
    sample_keep_list: null          # e.g. "qc/sample_keep_list.tsv" — one kept sample per line
    relatedness_table: null         # e.g. "qc/king.kin0" — pairwise kinship for group-aware CV
    sample_keep_list_col: "sample_id"
    # Column names in NF's carrier_matrix.tsv (adjust if NF changes its schema).
    columns:
      person_id:       "person_id"
      chrom:           "chr"
      pos:             "pos"
      ref:             "ref"
      alt:             "alt"
      gene:            "gene"
      is_clinvar_plp:  "is_clinvar_PLP"
      is_acmg_plp:     "is_acmg_PLP"
      is_am_plp:       "is_AM_PLP"
    sep: "\t"

  common_variants:
    root_glob: "common_variants/combined/batch_*"
    batch: null
    pca_file: "pca/pcs.tsv"
    kinship_file: "kinship/kinship.tsv"

  phenotypes:
    root_glob: "phenotypes/*"      # yyyy-mm-dd folders; picks latest by name
    date: null                     # null -> latest date folder
    files:
      phecodex:            "PheWas_MSM_phecodeX.tsv"
      encounter_diagnosis: "Encounter_Diagnosis.txt"      # ICD-coded
      problem_list:        "Problem_List.txt"             # ICD-coded
      medical_history:     "Medical_History.txt"
      surgical_history:    "Surgical_History.txt"
      family_history:      "Family_History.txt"
      demographics:        "Demographics.txt"
      social_history:      "Social_History.txt"
      vitals:              "Vitals.txt"
      ob_history:          "OB_HISTORY.txt"
      health_maintenance_glob: "HEALTH_MAINTENANCE_*.txt"

# --- Reference resources ----------------------------------------------------
# We do not annotate, so we reference nothing directly. VEP cache / ClinVar /
# gnomAD / AlphaMissense / ANNOVAR all belong to the NF pipeline's refs/ dir,
# recorded here only for provenance when reading its manifest.json.
resources:
  refs_root: /sc/arion/projects/rg_huangk06/variants_PLP_MSM/refs

# --- Focus gene panel (reporting / stratification only) ----------------------
gene_panels:
  cancer_predisposition_28:
    genes:
      - APC
      - ATM
      - BARD1
      - BMPR1A
      - BRCA1
      - BRCA2
      - BRIP1
      - CDH1
      - CDK4
      - CDKN2A
      - CHEK2
      - EPCAM
      - MLH1
      - MSH2
      - MSH6
      - MUTYH
      - NBN
      - NF1
      - PALB2
      - PMS2
      - POLD1
      - POLE
      - PTEN
      - RAD51C
      - RAD51D
      - SMAD4
      - STK11
      - TP53

# --- LSF / execution --------------------------------------------------------
lsf:
  queue: premium
  project: acc_MSM                 # confirm on cluster
  walltime: "12:00"
  memory_mb: 16000
  array_concurrency_cap: 50
  modules:
    - bcftools/1.19               # only for `bcftools query -l` (sample list)
    - python/3.11

# --- Phenotyping ------------------------------------------------------------
phenotype:
  # ICD -> phecodeX map. If null, uses the built-in cancer map in
  # src/phenotype/icd_mapping.py (CRC, breast, prostate, lung, ovarian, pancreatic).
  icd_to_phecodex_map: null

  cancer_phecodes:
    # phecodeX codes are placeholders — confirm against the real phecodeX v1.2 map.
    colorectal:  ["CA_101.1", "CA_101.11"]
    breast:      ["CA_105.1"]
    prostate:    ["CA_105.2"]              # TODO confirm
    lung:        ["CA_101.6"]              # TODO confirm
    ovarian:     ["CA_105.3"]              # TODO confirm
    pancreatic:  ["CA_101.2"]              # TODO confirm

  # EHR column layouts — real BioMe phenofile schemas.
  ehr_schema:
    encounter_diagnosis:
      person_id_col:   "sample_name"
      icd_col:         "dx_code"
      icd_version_col: "dx_code_type"       # values "ICD10" / "ICD9"
      date_col:        "encounter_date"
      date_format:     "%m/%d/%Y"
      sep:             "|"
    problem_list:
      person_id_col:   "sample_name"
      icd_col:         "icd9_code"          # NOTE: holds BOTH ICD-9 and ICD-10
      icd_version_col: "code_type"          # the source of truth for version
      noted_date_col:  "noted_date"
      resolved_col:    "resolved_date"
      status_col:      "status"
      date_format:     "%m/%d/%Y"
      sep:             "|"
    family_history:
      person_id_col:      "sample_name"
      relationship_col:   "relation"        # free text: "Mother", "Maternal Grandfather"
      condition_col:      "problem_description"  # free text: "Prostate Cancer"
      condition_code_col: null              # BioMe famhx has NO ICD codes
      degree_col:         null              # inferred from `relation`
      onset_age_col:      null
      date_format:        "%m/%d/%Y"
      sep:                "|"
    demographics:
      person_id_col:      "sample_name"
      birth_year_col:     "birth_year"
      sex_col:            "sex"
      enrollment_date_col: "enrollment_date"
      date_format:        "%m/%d/%Y"
      sep:                "|"
    phecodex_roster:
      format: "auto"                        # "wide" | "long" | "auto"
      person_id_col: "sample_name"
      phecodex_col:  "phecodeX"
      value_col:     "case_control"
      sep: "|"

  roster:
    famhx_scope: any_cancer                 # any_cancer | cancer_specific
    control_exclusion: any_cancer           # any_cancer | this_cancer_only
    emit_prevalent_cases: true              # keep with incident_flag=false
    min_control_encounters: 2
  famhx:
    relative_degrees: [1, 2]
    cancer_free_text_patterns:
      - "cancer"
      - "malignant"
      - "neoplasm"
      - "carcinoma"
      - "sarcoma"
      - "leukemia"
      - "leukaemia"
      - "lymphoma"
      - "melanoma"
      - "myeloma"
      - "tumor"
      - "tumour"
    # Free-text -> cancer-type classification (BioMe famhx has no codes).
    cancer_type_patterns:
      colorectal:  ["colon", "colorectal", "rectal", "rectum"]
      breast:      ["breast"]
      prostate:    ["prostate"]
      lung:        ["lung", "bronchus"]
      ovarian:     ["ovary", "ovarian"]
      pancreatic:  ["pancreas", "pancreatic"]

# --- Carrier consumption (NF output -> analysis features) -------------------
carriers:
  # NF emits long format (one row per variant x person). We aggregate to
  # per-person / per-gene features for ML.
  frameworks: [clinvar, acmg, am]           # which P/LP calls to build features from
  emit_wide_pivot: true                     # sample x gene matrix
  restrict_to_sample_keep_list: true        # use NF's sample keep-list (see carrier_source)
  panel_for_aggregate: cancer_predisposition_28

# --- ML ---------------------------------------------------------------------
ml:
  cancers: [colorectal, breast]     # add cancers by dropping a YAML in config/
  matching: propensity_kto1
  temporal_leakage:
    feature_window_days: [-730, -182]   # pre-index [730, 182] days
  covariates: [age, sex, self_reported_race, PC1..PC10, bmi, smoking, alcohol]
  models: [penalized_logistic, cox, random_forest, xgboost]
  cv: stratified_group_kfold
  n_splits: 5
