name: msm-analysis
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # Only for `bcftools query -l` to list genotyped samples. Annotation, carrier
  # extraction, and sample QC all belong to germline-plp-carrier-nf.
  - bcftools=1.19
  - pandas=2.2.*
  - numpy=1.26.*
  - scipy=1.13.*
  - scikit-learn=1.5.*
  - statsmodels=0.14.*
  - lifelines=0.28.*
  - xgboost=2.0.*
  - matplotlib
  - seaborn
  - pyyaml
  - pyarrow
  - pytest
  - shap
  - joblib
  - tqdm
